name: Android Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ASHU_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ASHU_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ASHU_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ASHU_RELEASE_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.ASHU_CERT_SHA256 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] &&
             [ -n "$STORE_PASSWORD" ] &&
             [ -n "$KEY_ALIAS" ] &&
             [ -n "$KEY_PASSWORD" ] &&
             [ -n "$CERT_SHA256" ]; then

            echo "Building signed production release"

            KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

            gradle :app:assembleRelease --no-daemon \
              -PASHU_RELEASE_STORE_FILE="$KEYSTORE_PATH" \
              -PASHU_RELEASE_STORE_PASSWORD="$STORE_PASSWORD" \
              -PASHU_RELEASE_KEY_ALIAS="$KEY_ALIAS" \
              -PASHU_RELEASE_KEY_PASSWORD="$KEY_PASSWORD" \
              -PASHU_CERT_SHA256="$CERT_SHA256"
          else
            echo "WARNING: Release signing secrets missing."
            echo "Building with project's debug-signing fallback."
            gradle :app:assembleRelease --no-daemon
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AshuPhone-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
